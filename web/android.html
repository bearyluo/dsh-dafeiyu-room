<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>小屋悬浮窗 · 安卓连接</title><link rel="stylesheet" href="./android.css"><script src="./android.js" defer></script></head><body><main><div class="house" aria-hidden="true">⌂</div><h1>把小屋放在身边</h1><p>一个可拖动的小房子。点开，就能看见她在屋里生活。</p><a class="primary" id="open" href="#">打开安卓悬浮窗</a><a class="secondary" href="./android-app.apk" download>安装 / 更新预览版 0.6.4-preview.1</a><p id="status" role="status"></p><ol><li>安装小屋伴侣，允许“显示在其他应用上层”。</li><li>返回这里点“打开安卓悬浮窗”，在应用里点“开启悬浮小屋”。</li><li>切换到其他应用也能看；拖动移动，点击展开或收起。</li></ol><a id="browser" href="./mobile.html">先在浏览器看小屋</a><small id="connection-note">内网连接：手机和电脑连接同一 Wi-Fi，电脑上的 DSH 和小屋服务保持运行。此链接只用于查看小屋。</small></main></body></html>
