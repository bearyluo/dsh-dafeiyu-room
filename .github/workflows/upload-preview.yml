name: Upload signed preview assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    if: github.repository == 'bearyluo/dsh-dafeiyu-room'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.6.4-preview.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/release-assets-v0.6.4-preview.1
          persist-credentials: false
      - name: Verify the existing signed distribution files
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Upload only to the matching draft
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" dist/dsh-dafeiyu-room-0.6.4-preview.1.tgz dist/dafeiyu-room-android-0.6.4-preview.1.apk dist/SHA256SUMS.txt --clobber
